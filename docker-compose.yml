services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Nécessite un export GTFS de la métropole et un extrait OpenStreetMap (.osm.pbf)
  # déposés dans routing-engine/data/ avant le premier lancement (voir routing-engine/README.md)
  otp:
    image: opentripplanner/opentripplanner:2.5.0
    restart: unless-stopped
    volumes:
      - ./routing-engine/data:/var/opentripplanner
      # otp-config.json (versionné, contrairement à data/) active le
      # géocodeur REST intégré à OTP (SandboxAPIGeocoder, désactivé par
      # défaut) - utilisé par GET /geocode côté backend (issue #81).
      - ./routing-engine/otp-config.json:/var/opentripplanner/otp-config.json:ro
    command: ["--build", "--serve"]
    ports:
      - "8080:8080"

  # Capture les emails du backend sans les envoyer reellement (issue #70) -
  # consultables sur l'UI web http://localhost:8025. Equivalent dev de
  # Postfix en prod (docker-compose.prod.yml), meme code cote backend
  # (nodemailer, seule la variable MAIL_HOST change).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Géocodage d'adresses réel (issue #167/#168, docs/specs/nominatim-geocodage-adresses.md).
  # Nominatim auto-hébergé : embarque SA PROPRE base PostgreSQL, indépendante
  # du service `postgres` applicatif ci-dessus - jamais de données métier
  # mélangées. Joignable uniquement sur le réseau Docker (le backend l'appelle
  # via NOMINATIM_URL) ; le port 8081 n'est exposé qu'en dev pour inspecter
  # les réponses brutes, jamais en prod (voir docker-compose.prod.yml).
  #
  # 1er démarrage = BOOTSTRAP : l'extrait Ille-et-Vilaine (PBF_URL) est
  # téléchargé puis importé (~30 min, gourmand en RAM/disque - voir la spec
  # §3.3). Le volume `nominatim_data` conserve la base ensuite : les
  # redémarrages suivants ne réimportent pas.
  nominatim:
    image: mediagis/nominatim:5.3.2
    restart: unless-stopped
    environment:
      PBF_URL: https://download.openstreetmap.fr/extracts/europe/france/bretagne/ille_et_vilaine.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD}
      # Données d'importance Wikipedia/Wikidata (améliore le classement) :
      # ~1,5 Go de plus à télécharger + import plus long, superflu pour de
      # l'autocomplétion sur un extrait départemental - Nominatim calcule
      # une importance de repli sans.
      IMPORT_WIKIPEDIA: "false"
    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
    shm_size: 1gb
    ports:
      - "8081:8080"

  # Le build échouera tant que backend/ ne contient pas de projet NestJS initialisé
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - otp
      - mailhog
      - nominatim
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Acces de `npm run import:gtfs` (issue #12) au meme dossier que le
      # service otp ci-dessus : lit routing-engine/test-fixtures/ en dev
      # hors ligne (GTFS_LOCAL_PATH) et ecrit le zip valide dans
      # routing-engine/data/ pour qu'OTP le charge au prochain --build.
      - ./routing-engine:/app/routing-engine

  # Le build échouera tant que frontend/ ne contient pas de projet Vite initialisé
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  # Base PostgreSQL interne de Nominatim (issue #168) - séparée de
  # postgres_data, contient l'extrait OSM importé (plusieurs Go).
  nominatim_data:
