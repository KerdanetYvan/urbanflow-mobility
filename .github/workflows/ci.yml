name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for package.json
        id: check
        run: echo "exists=$(test -f frontend/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Tests
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present

      # Le vrai build (tsc + vite build) - distinct des tests (Vitest, sa
      # propre transformation TS, plus tolerante) : sans cette etape, une
      # erreur de compilation peut passer la CI tout en cassant le build
      # utilise pour le deploiement (issue #104, bug de prod du 2026-08-08).
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present

      - name: Skip (no package.json yet)
        if: steps.check.outputs.exists != 'true'
        run: echo "frontend/package.json absent — étape ignorée en attendant l'initialisation du projet."

  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for package.json
        id: check
        run: echo "exists=$(test -f backend/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present

      - name: Tests
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present

      # Le vrai build (nest build / tsc -b) - distinct des tests (Jest via
      # ts-jest, sa propre transformation TS, plus tolerante) : sans cette
      # etape, une erreur de compilation peut passer la CI tout en cassant
      # le build Docker de production (issue #104, bug de prod du
      # 2026-08-08 - dommage collateral d'un volume Docker dev obsolete,
      # jamais detecte faute de ce build en CI).
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run build --if-present

      - name: Skip (no package.json yet)
        if: steps.check.outputs.exists != 'true'
        run: echo "backend/package.json absent — étape ignorée en attendant l'initialisation du projet."

  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Seulement sur un push reel sur main (pas sur les PR) : merger sur main
    # redeploie automatiquement, ouvrir/mettre a jour une PR ne deploie rien.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build du frontend
        working-directory: frontend
        env:
          # Chemin relatif : fonctionne quel que soit le domaine, Caddy route
          # /api/* vers le backend (voir /etc/caddy/Caddyfile sur le serveur).
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Configurer l'accès SSH au serveur
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Déployer les fichiers statiques du frontend
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/urbanflow-frontend/"

      - name: Déployer le backend (git reset --hard + rebuild du conteneur)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /home/ubuntu/app
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up --build -d
          '
