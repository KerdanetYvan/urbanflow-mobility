# Stack de production (issue #24). Different du docker-compose.yml de dev :
# - backend construit avec un Dockerfile de production (build compile,
#   pas de bind mount, pas de mode watch)
# - pas de service frontend : le build (frontend/dist) est servi en fichiers
#   statiques directement par Caddy (reverse proxy installe sur l'hote,
#   voir /etc/caddy/Caddyfile), pas besoin d'un conteneur pour ca
# - service otp (issue #120) : reintroduit une fois les vraies donnees
#   GTFS/OSM de la metropole disponibles (#12/#90) - voir routing-engine/README.md
#   pour la procedure de bootstrap initial des donnees sur le VPS (routing-engine/data/
#   n'est pas versionne, donc pas transfere par le "git reset --hard" du deploiement)
# - postgres n'expose aucun port : seul le reseau docker interne y accede
# - le port du backend est lie a 127.0.0.1 uniquement (pas 0.0.0.0) : Docker
#   manipule iptables directement et contourne ufw pour les ports publies,
#   donc "127.0.0.1:3000:3000" est necessaire pour que le port ne soit
#   PAS expose publiquement - seul Caddy (sur l'hote) doit pouvoir l'atteindre.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Audit securite/fiabilite OWASP #262 : pg_isready est deja fourni par
    # l'image officielle postgis/postgis (verifie), le backend peut donc
    # attendre une base reellement prete (condition: service_healthy
    # ci-dessous) plutot que juste "conteneur demarre".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Relai SMTP sortant auto-heberge (issue #70) : pas de SaaS externe
  # (Resend/SendGrid...) pour ne pas dependre d'un quota d'envoi tiers, voir
  # backend/README.md. Image boky/postfix (relai communautaire actif,
  # configurable par variables d'env) plutot qu'une image Postfix maison :
  # DKIM_AUTOGENERATE=1 genere et applique automatiquement une paire de cles
  # DKIM (persistee dans le volume dkim_keys pour ne pas en regenerer une
  # nouvelle a chaque redemarrage, ce qui invaliderait la cle publiee en DNS).
  #
  # ETAPE MANUELLE non faite ici (hors de portee du code) : apres le premier
  # demarrage, publier chez le registrar du domaine (1) un enregistrement
  # TXT SPF autorisant l'IP du VPS a emettre pour le domaine, (2) la cle
  # publique DKIM generee (recuperable dans le volume dkim_keys,
  # mail._domainkey.<domaine>), (3) un rDNS/PTR correct sur l'IP du VPS
  # aupres d'OVHcloud - sans ces trois elements, les emails partiront mais
  # atterriront probablement en spam ou seront rejetes.
  postfix:
    image: boky/postfix
    restart: always
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_ALLOWED_SENDER_DOMAINS}
      DKIM_AUTOGENERATE: 1
    volumes:
      - dkim_keys:/etc/opendkim/keys
    # Simple sonde TCP sur le port SMTP (nc confirme present dans l'image) -
    # ne verifie pas que le relai fonctionne reellement (SPF/DKIM/rDNS,
    # etapes manuelles documentees plus haut), juste que le service ecoute.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 25"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Pas de port publie : seul le reseau docker interne (le service
    # "backend" ci-dessous) doit pouvoir l'atteindre, sur le port SMTP
    # standard du conteneur (25).

  # Moteur de routage (issue #120). Memes contraintes que le service backend
  # ci-dessous : pas de port publie, seul le reseau docker interne y accede
  # (le backend l'appelle via OTP_URL=http://otp:8080/..., voir .env.example) -
  # pas besoin de passer par Caddy, OTP n'est jamais appele directement par
  # le navigateur. routing-engine/data/ (gtfs-metropole.zip + extrait OSM
  # metropolitain) doit etre deja peuple sur le VPS avant le premier
  # demarrage de ce service - voir routing-engine/README.md, section
  # "Deploiement en production".
  otp:
    image: opentripplanner/opentripplanner:2.5.0
    restart: always
    volumes:
      - ./routing-engine/data:/var/opentripplanner
      - ./routing-engine/otp-config.json:/var/opentripplanner/otp-config.json:ro
    command: ["--build", "--serve"]
    # curl confirme present dans cette image (Ubuntu). start_period genereux
    # (5 min) : le premier demarrage compile le graphe complet de la
    # metropole avant de servir quoi que ce soit (~36s mesures en session sur
    # le jeu de donnees reel, voir routing-engine/README.md - marge large
    # pour un VPS moins puissant que le poste de developpement).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/otp/routers/default"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m

  # Geocodage d'adresses (issue #167/#168). Comme otp : jamais expose, seul le
  # reseau docker interne y accede (le backend l'appelle via NOMINATIM_URL).
  # Embarque sa propre base PostgreSQL, isolee du service postgres applicatif.
  # BOOTSTRAP initial obligatoire avant le premier demarrage utile : l'import
  # de l'extrait OSM (~30 min, gourmand en RAM/disque) doit etre lance une
  # fois sur le VPS, jamais en meme temps qu'un build de graphe OTP - voir
  # routing-engine/README.md, section deploiement.
  nominatim:
    image: mediagis/nominatim:5.3.2
    restart: always
    environment:
      PBF_URL: https://download.openstreetmap.fr/extracts/europe/france/bretagne/ille_et_vilaine.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD}
      IMPORT_WIKIPEDIA: "false"
    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
    shm_size: 1gb
    # curl confirme present dans cette image. start_period tres genereux
    # (35 min) : le tout premier demarrage importe l'extrait OSM avant de
    # repondre quoi que ce soit (~6 min observes en session pour
    # l'Ille-et-Vilaine, marge large pour un VPS - voir routing-engine/README.md).
    # /status est l'endpoint documente pour verifier que l'import est termine.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35m

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.prod.Dockerfile
    restart: always
    env_file: .env
    # condition: service_healthy (audit securite/fiabilite OWASP #262) :
    # attend une base/OTP/Nominatim reellement prets, pas juste demarres -
    # evite des cycles de retry TypeORM inutiles au demarrage (deja tolere
    # avant ce changement, mais plus lent). otp/nominatim peuvent chacun
    # prendre plusieurs minutes a devenir "healthy" au tout premier
    # demarrage (voir leurs healthcheck ci-dessus) - le backend attendra
    # en consequence avant de demarrer, ce qui est le comportement voulu.
    depends_on:
      postgres:
        condition: service_healthy
      postfix:
        condition: service_healthy
      otp:
        condition: service_healthy
      nominatim:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Partage routing-engine/data avec le service otp ci-dessus : sans ce
      # montage, `npm run import:gtfs` (GTFS_OTP_OUTPUT_PATH) ecrit le zip
      # dans le systeme de fichiers ephemere du conteneur backend, jamais vu
      # par otp - meme motif que le montage `./routing-engine` du backend en
      # dev (docker-compose.yml), limite ici au seul sous-dossier necessaire.
      #
      # ATTENTION (audit securite OWASP #262) : le conteneur backend tourne
      # desormais en utilisateur non-root "node" (uid/gid 1000, voir
      # docker/backend.prod.Dockerfile) - si `npm run import:gtfs` est lance
      # a la main sur ce service et echoue en permission refusee sur ce
      # dossier bind-monte, ajuster le proprietaire cote VPS
      # (`sudo chown -R 1000:1000 routing-engine/data`) plutot que de
      # revenir a un conteneur root.
      - ./routing-engine/data:/app/routing-engine/data

volumes:
  postgres_data:
  dkim_keys:
  # Base PostgreSQL interne de Nominatim (issue #168) - plusieurs Go apres
  # import, a provisionner sur le VPS en consequence.
  nominatim_data:
