<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!--
      Anti-FOUC du reglage de theme manuel (issue #245, voir
      lib/theme.ts) : pose `data-theme` sur <html> AVANT le premier paint,
      donc avant que le CSS (tokens.css) ne soit applique - sans ca, la page
      s'afficherait brievement dans le theme systeme puis basculerait vers
      le theme choisi une fois React monte, un flash visible et genant.
      Script synchrone en tete de <head> (pas de `type="module"`, qui serait
      differe) : rien n'a encore ete peint a ce stade, quel que soit
      l'endroit ou Vite injecte les <link rel="stylesheet"> au build. Logique
      dupliquee de `applyTheme` (lib/theme.ts) en JS brut a dessein : ce
      module ES n'est pas encore charge/execute a ce stade du parsing HTML -
      garder les deux synchronises si cette logique change. `try/catch` ici
      seulement (contrairement au reste du projet, voir le commentaire de
      lib/theme.ts) : une exception non rattrapee a ce stade bloquerait le
      parsing du reste du document, un risque que le reste de l'app (execute
      apres React, avec ses propres frontieres d'erreur) ne prend pas.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('urbanflow.theme.v1');
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.setAttribute('data-theme', pref);
          }
        } catch (e) {
          // Navigation privee tres ancienne / localStorage indisponible :
          // repli silencieux sur le theme systeme, comportement historique.
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanFlow Mobility</title>

    <!--
      Preconnect vers les 3 sous-domaines de tuiles OpenStreetMap (audit
      Lighthouse, insight "LCP request discovery") : la carte (MapView,
      Leaflet) est le premier ecran vu par l'utilisateur et son plus gros
      poste de requetes (10-30 tuiles PNG, voir le commentaire runtimeCaching
      de vite.config.ts) - or ces requetes ne peuvent demarrer qu'une fois
      Leaflet monte et le viewport calcule, donc apres le JS. Etablir la
      connexion (DNS + TLS) des le parsing du HTML, avant meme ce premier
      fetch, raccourcit d'autant le delai avant que la premiere tuile
      (element LCP mesure) ne s'affiche.
    -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://c.tile.openstreetmap.org" />

    <!--
      Le lien <link rel="manifest"> et l'enregistrement du service worker
      sont injectes automatiquement au build par vite-plugin-pwa
      (voir vite.config.ts, injectRegister: 'auto' par defaut) : pas besoin
      de les ajouter ici a la main.
    -->

    <!--
      theme-color : teinte la barre d'adresse/barre de statut du navigateur
      (Chrome Android notamment) - meme valeur que theme_color du manifest
      (vite.config.ts) pour rester coherent entre l'app installee et l'app
      ouverte dans un onglet classique.
    -->
    <meta name="theme-color" content="#f5a623" />

    <!--
      iOS ignore le manifest web pour l'icone/le mode plein ecran : ces
      balises Apple-specifiques sont necessaires en plus pour un "Ajout a
      l'ecran d'accueil" correct sur Safari iOS (icone dediee generee par
      npm run icons, voir scripts/generate-pwa-icons.mjs).
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UrbanFlow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
